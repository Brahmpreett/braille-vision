            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        @keyframes scan-line {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(400%); opacity: 0; }
        }
        
        .scanning-line {
            animation: scan-line 2.5s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .pulse-effect {
            animation: pulse-ring 2s ease-in-out infinite;
        }

        .braille-blur {
            filter: blur(8px) brightness(0.6);
        }

<script>
        // Micro-interaction simulation
        const steps = document.querySelectorAll('.space-y-stack-gap-sm > div');
        let currentStep = 1;

        // Mock progression for demonstration
        setInterval(() => {
            if (currentStep < steps.length - 1) {
                // Update previous step to complete
                const prevStep = steps[currentStep];
                prevStep.classList.remove('animate-pulse', 'bg-surface-container-highest');
                prevStep.classList.add('bg-surface-container-high');
                prevStep.querySelector('div').innerHTML = '<span class="material-symbols-outlined text-on-primary-container text-sm" style="font-variation-settings: \'FILL\' 1;">check</span>';
                prevStep.querySelector('div').classList.add('bg-primary-container');
                prevStep.querySelector('span').classList.remove('text-primary-container');
                prevStep.querySelector('span').classList.add('text-on-surface');

                // Update next step to active
                currentStep++;
                const nextStep = steps[currentStep];
                nextStep.classList.remove('opacity-60', 'bg-surface-container', 'border-outline-variant');
                nextStep.classList.add('animate-pulse', 'bg-surface-container-highest', 'border-primary-container');
                nextStep.querySelector('div').classList.remove('border-outline-variant');
                nextStep.querySelector('div').classList.add('border-primary-container');
                nextStep.querySelector('div').innerHTML = '<div class="w-2 h-2 bg-primary-container rounded-full animate-bounce"></div>';
                nextStep.querySelector('span').classList.remove('text-on-surface-variant');
                nextStep.querySelector('span').classList.add('text-primary-container');
            }
        }, 3000);
    </script>
