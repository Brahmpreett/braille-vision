<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>BrailleVision - Scan &amp; Translate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            display: inline-block;
            vertical-align: middle;
        }
        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            background: #ffd600;
            box-shadow: 0 0 20px #ffd600;
            animation: scan 3s ease-in-out infinite;
            z-index: 20;
        }
        @keyframes scan {
            0%, 100% { top: 10%; opacity: 0.2; }
            50% { top: 90%; opacity: 1; }
        }
        .touch-target-xl {
            min-height: 80px;
        }
        body {
            background-color: #131313;
            color: #e5e2e1;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#70f6ff",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#002022",
                        "on-tertiary-container": "#00696f",
                        "outline-variant": "#4d4632",
                        "on-primary": "#3a3000",
                        "error-container": "#93000a",
                        "on-tertiary": "#00373a",
                        "background": "#131313",
                        "on-primary-fixed": "#221b00",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#544600",
                        "primary": "#fff5dc",
                        "inverse-primary": "#705d00",
                        "on-primary-container": "#705d00",
                        "outline": "#999077",
                        "surface-container-high": "#2a2a2a",
                        "surface": "#131313",
                        "tertiary-fixed-dim": "#00dce7",
                        "primary-fixed": "#ffe170",
                        "surface-variant": "#353534",
                        "on-secondary": "#303030",
                        "surface-tint": "#e9c400",
                        "on-secondary-fixed-variant": "#474746",
                        "on-background": "#e5e2e1",
                        "tertiary": "#d8fcff",
                        "on-secondary-fixed": "#1b1b1c",
                        "surface-dim": "#131313",
                        "inverse-surface": "#e5e2e1",
                        "secondary-container": "#474746",
                        "on-surface-variant": "#d0c6ab",
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-container": "#ffd600",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed": "#e5e2e1",
                        "on-tertiary-fixed-variant": "#004f53",
                        "surface-bright": "#393939",
                        "tertiary-container": "#00f0fc",
                        "on-surface": "#e5e2e1",
                        "on-error": "#690005",
                        "on-secondary-container": "#b7b5b4",
                        "inverse-on-surface": "#313030",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-highest": "#353534",
                        "secondary": "#c8c6c5",
                        "primary-fixed-dim": "#e9c400",
                        "surface-container": "#201f1f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-md": "20px",
                        "touch-target-min": "56px",
                        "container-padding": "24px",
                        "unit": "8px",
                        "stack-gap-sm": "12px",
                        "stack-gap-lg": "32px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md-mobile": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["36px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "700"}],
                        "body-lg": ["20px", {"lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400"}],
                        "headline-sm": ["22px", {"lineHeight": "1.3", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "headline-md": ["28px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "700"}],
                        "label-lg": ["16px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "headline-lg-mobile": ["30px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-md": ["18px", {"lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface border-b-2 border-outline-variant docked full-width top-0 z-50 flex justify-between items-center h-[56px] px-container-padding w-full">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-variant active:scale-95 transition-all p-2 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed">arrow_back</span>
</button>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile font-bold text-primary-fixed">BrailleVision</h1>
</div>
<button class="hover:bg-surface-variant active:scale-95 transition-all p-2 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed">settings</span>
</button>
</header>
<main class="flex-grow pb-[80px] overflow-y-auto">
<!-- Hero Section: Camera Preview (50% screen) -->
<section class="relative h-[397px] w-full bg-surface-container-lowest overflow-hidden">
<div class="scan-line"></div>
<img class="w-full h-full object-cover opacity-80 grayscale contrast-125" data-alt="A close-up, high-contrast POV camera view of a finger tracing Grade 2 Braille dots on a white textured paper surface. The scene is illuminated by dramatic side-lighting that casts sharp shadows from the raised dots, enhancing their visibility for the AI translation system. The aesthetic is utilitarian and tech-focused, using deep blacks and sharp highlights to reflect the accessibility-first design of the app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQ9tLYBg0EJVKo9nKMsMV2hCODqK7j84qFsW9z912nFOxha2Q868_2gOAxLYqI_TllFvkTV6Jp5FOn3px1BqiN7hsAKtOwivbTXtvI7bzoenrYrWv4vMHUSc_91HnSD5OUn6ahIc45-xkwi0QO6MEq6TqF5T3FeGflkDQfRlSJOaVYxoC7JgelP1WuqdNVESq13BN5XQybpkxm4Yp3wDp4Q4YQO-r6K0mjmxiON4hg4A01O_VQJI8nnsspQMj-kurfvQoIy-yE7TM"/>
<!-- Overlay Info -->
<div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full border border-primary-fixed/30 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></div>
<span class="font-label-lg text-label-lg text-on-surface">LIVE FEED: GRADE 2</span>
</div>
<!-- Corner Brackets for Focus UI -->
<div class="absolute inset-0 border-[32px] border-transparent">
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary-fixed rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary-fixed rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary-fixed rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary-fixed rounded-br-xl"></div>
</div>
</section>
<!-- Action Area -->
<div class="px-container-padding py-stack-gap-md space-y-gutter">
<!-- Primary Action: Scan Braille -->
<button class="w-full touch-target-xl bg-primary-container text-on-primary-container flex items-center justify-center gap-4 rounded-xl active:scale-[0.98] transition-all border-2 border-primary-fixed shadow-[0_8px_0_0_#544600] active:shadow-none active:translate-y-1">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-headline-md-mobile text-headline-md-mobile uppercase tracking-wider">Scan Braille</span>
</button>
<!-- Secondary Grid -->
<div class="grid grid-cols-2 gap-gutter">
<button class="touch-target-xl bg-surface-container-high border-2 border-outline-variant hover:border-primary-fixed rounded-xl flex flex-col items-center justify-center gap-2 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary-fixed text-3xl">history</span>
<span class="font-label-lg text-label-lg text-on-surface">History</span>
</button>
<button class="touch-target-xl bg-surface-container-high border-2 border-outline-variant hover:border-primary-fixed rounded-xl flex flex-col items-center justify-center gap-2 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary-fixed text-3xl">menu_book</span>
<span class="font-label-lg text-label-lg text-on-surface">Learn</span>
</button>
</div>
<!-- Recent Scan Snippet (Bento-style card) -->
<div class="bg-surface-container border-2 border-outline-variant rounded-xl p-stack-gap-sm">
<div class="flex items-center justify-between mb-2">
<span class="font-label-lg text-label-lg text-on-surface-variant">LAST TRANSLATION</span>
<span class="text-xs text-on-surface-variant/60 uppercase">2 mins ago</span>
</div>
<div class="p-4 bg-background rounded-lg border border-outline-variant/30">
<p class="font-body-md text-body-md text-primary-fixed-dim leading-relaxed">
                        "Danger: Do not touch the internal components while the device is powered on."
                    </p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-2 h-[80px] bg-surface-container-high border-t-2 border-outline-variant">
<!-- Scan (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-lg p-2 min-h-[56px] border-2 border-primary-fixed w-1/4 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-lg text-label-lg">Scan</span>
</button>
<!-- History -->
<button class="flex flex-col items-center justify-center text-secondary p-2 min-h-[56px] w-1/4 hover:bg-secondary-container active:scale-95 transition-all rounded-lg">
<span class="material-symbols-outlined">history</span>
<span class="font-label-lg text-label-lg">History</span>
</button>
<!-- Learn -->
<button class="flex flex-col items-center justify-center text-secondary p-2 min-h-[56px] w-1/4 hover:bg-secondary-container active:scale-95 transition-all rounded-lg">
<span class="material-symbols-outlined">menu_book</span>
<span class="font-label-lg text-label-lg">Learn</span>
</button>
</nav>
<script>
        // Haptic feedback simulation for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(20);
                }
            });
        });

        // Simple atmospheric scan pulse behavior
        const scanLine = document.querySelector('.scan-line');
        setInterval(() => {
            scanLine.style.opacity = Math.random() * 0.5 + 0.5;
        }, 1500);
    </script>
</body></html>
